<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地鼠設計預覽 v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #7ecbea 0%, #88c97a 50%, #6ab560 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px 16px;
    font-family: 'Helvetica Neue', sans-serif;
  }
  h2 { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.35); font-size: 1.1rem; letter-spacing: 2px; }
  .row { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card label { color: #fff; font-size: 0.82rem; text-shadow: 0 1px 2px rgba(0,0,0,.3); }

  /* Simulate in-game hole */
  .hole-wrap {
    position: relative;
    width: 120px;
    height: 150px;
    overflow: hidden;
    background: linear-gradient(180deg, transparent 55%, #6ab560 55%);
    border-radius: 8px;
  }
  .mole-svg  { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 82px; z-index: 1; }
  .hole-svg  { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 2; }
</style>
</head>
<body>

<h2>🐾 新地鼠設計預覽 v2</h2>

<div class="row">

  <!-- ── 普通狀態 ─────────────────────────────────── -->
  <div class="card">
    <div class="hole-wrap">
      <svg class="mole-svg" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bodyN" cx="50%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#A0622A"/>
            <stop offset="100%" stop-color="#6B3A10"/>
          </radialGradient>
          <radialGradient id="faceN" cx="40%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FDDEA8"/>
            <stop offset="55%" stop-color="#F0B86A"/>
            <stop offset="100%" stop-color="#D98A3A"/>
          </radialGradient>
        </defs>

        <!-- Body cone -->
        <path d="M 22 150 C 22 84, 78 84, 78 150 Z" fill="url(#bodyN)"/>

        <!-- Left paw + claws -->
        <ellipse cx="12" cy="92" rx="15" ry="9" fill="#9A5828" transform="rotate(-12,12,92)"/>
        <ellipse cx="1"  cy="87" rx="4" ry="5.5" fill="#7A3810" transform="rotate(-20,1,87)"/>
        <ellipse cx="7"  cy="84" rx="4" ry="5.5" fill="#7A3810" transform="rotate(-12,7,84)"/>
        <ellipse cx="14" cy="83" rx="4" ry="5.5" fill="#7A3810" transform="rotate(-5,14,83)"/>

        <!-- Right paw + claws -->
        <ellipse cx="88" cy="92" rx="15" ry="9" fill="#9A5828" transform="rotate(12,88,92)"/>
        <ellipse cx="99" cy="87" rx="4" ry="5.5" fill="#7A3810" transform="rotate(20,99,87)"/>
        <ellipse cx="93" cy="84" rx="4" ry="5.5" fill="#7A3810" transform="rotate(12,93,84)"/>
        <ellipse cx="86" cy="83" rx="4" ry="5.5" fill="#7A3810" transform="rotate(5,86,83)"/>

        <!-- Head — big round fluffy -->
        <circle cx="50" cy="44" r="44" fill="url(#bodyN)"/>
        <!-- Face patch — lighter oval -->
        <ellipse cx="50" cy="52" rx="32" ry="34" fill="url(#faceN)"/>
        <!-- Forehead highlight -->
        <ellipse cx="36" cy="30" rx="18" ry="14" fill="#FDEBD0" opacity=".35"/>

        <!-- Ears outer -->
        <circle cx="13" cy="10" r="13" fill="#6B3A14"/>
        <circle cx="87" cy="10" r="13" fill="#6B3A14"/>
        <!-- Ears inner -->
        <circle cx="13" cy="10" r="8"  fill="#F09070"/>
        <circle cx="87" cy="10" r="8"  fill="#F09070"/>

        <!-- Eyes — BIG kawaii (like reference) -->
        <!-- Left eye -->
        <ellipse cx="30" cy="32" rx="13" ry="14" fill="white"/>
        <circle  cx="32" cy="34" r="10"  fill="#1C1008"/>
        <circle  cx="39" cy="25" r="5.5" fill="white"/>
        <circle  cx="28" cy="39" r="2"   fill="white" opacity=".55"/>
        <!-- Right eye -->
        <ellipse cx="70" cy="32" rx="13" ry="14" fill="white"/>
        <circle  cx="68" cy="34" r="10"  fill="#1C1008"/>
        <circle  cx="61" cy="25" r="5.5" fill="white"/>
        <circle  cx="72" cy="39" r="2"   fill="white" opacity=".55"/>

        <!-- Zhuyin character (before nose so nose shows on top) -->
        <text x="50" y="58" font-family="sans-serif" font-size="26" font-weight="bold"
              fill="#CC2200" text-anchor="middle">ㄅ</text>

        <!-- Nose (drawn on top of character) -->
        <ellipse cx="50" cy="48" rx="6.5" ry="5.5" fill="#E07880"/>
        <ellipse cx="50" cy="46.5" rx="4" ry="3"  fill="#F8A8B0"/>

        <!-- Cheeks -->
        <ellipse cx="14" cy="56" rx="10" ry="7" fill="#FF6060" opacity=".22"/>
        <ellipse cx="86" cy="56" rx="10" ry="7" fill="#FF6060" opacity=".22"/>

        <!-- Surprised open mouth (small O) -->
        <ellipse cx="50" cy="67" rx="6"  ry="5.5" fill="#2E1208"/>
        <ellipse cx="50" cy="66" rx="4.5" ry="4" fill="#C04050"/>
        <ellipse cx="50" cy="65" rx="3"  ry="2"  fill="#E06070" opacity=".6"/>
      </svg>

      <!-- Hole (same as game) -->
      <svg class="hole-svg" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="30" rx="55" ry="25" fill="#5CB832"/>
        <ellipse cx="60" cy="32" rx="45" ry="18" fill="#3E2723"/>
        <ellipse cx="60" cy="35" rx="35" ry="12" fill="#261412"/>
      </svg>
    </div>
    <label>普通狀態</label>
  </div>

  <!-- ── 打到了 hit 狀態 ─────────────────────────── -->
  <div class="card">
    <div class="hole-wrap">
      <svg class="mole-svg" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="faceH" cx="40%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#EDFFC8"/>
            <stop offset="55%" stop-color="#C8F080"/>
            <stop offset="100%" stop-color="#8CC840"/>
          </radialGradient>
        </defs>

        <path d="M 22 150 C 22 84, 78 84, 78 150 Z" fill="#6B3A10"/>
        <ellipse cx="12" cy="92" rx="15" ry="9" fill="#9A5828" transform="rotate(-12,12,92)"/>
        <ellipse cx="1"  cy="87" rx="4" ry="5.5" fill="#7A3810" transform="rotate(-20,1,87)"/>
        <ellipse cx="7"  cy="84" rx="4" ry="5.5" fill="#7A3810" transform="rotate(-12,7,84)"/>
        <ellipse cx="14" cy="83" rx="4" ry="5.5" fill="#7A3810" transform="rotate(-5,14,83)"/>
        <ellipse cx="88" cy="92" rx="15" ry="9" fill="#9A5828" transform="rotate(12,88,92)"/>
        <ellipse cx="99" cy="87" rx="4" ry="5.5" fill="#7A3810" transform="rotate(20,99,87)"/>
        <ellipse cx="93" cy="84" rx="4" ry="5.5" fill="#7A3810" transform="rotate(12,93,84)"/>
        <ellipse cx="86" cy="83" rx="4" ry="5.5" fill="#7A3810" transform="rotate(5,86,83)"/>

        <!-- Head — green when hit -->
        <circle cx="50" cy="44" r="44" fill="#8CC840"/>
        <ellipse cx="50" cy="52" rx="32" ry="34" fill="url(#faceH)"/>
        <ellipse cx="36" cy="30" rx="18" ry="14" fill="#EFFFCC" opacity=".35"/>

        <!-- Ears -->
        <circle cx="13" cy="10" r="13" fill="#6B3A14"/>
        <circle cx="87" cy="10" r="13" fill="#6B3A14"/>
        <circle cx="13" cy="10" r="8"  fill="#F09070"/>
        <circle cx="87" cy="10" r="8"  fill="#F09070"/>

        <!-- Happy eyes ^‿^ -->
        <path d="M 18 34 Q 30 20 42 34" fill="none" stroke="#1C1008" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M 58 34 Q 70 20 82 34" fill="none" stroke="#1C1008" stroke-width="4.5" stroke-linecap="round"/>

        <!-- Stars -->
        <text x="12" y="18" font-size="12" text-anchor="middle">⭐</text>
        <text x="88" y="18" font-size="12" text-anchor="middle">⭐</text>

        <!-- Zhuyin character (green) -->
        <text x="50" y="58" font-family="sans-serif" font-size="26" font-weight="bold"
              fill="#2A7A10" text-anchor="middle">ㄅ</text>

        <!-- Nose -->
        <ellipse cx="50" cy="48" rx="6.5" ry="5.5" fill="#E07880"/>
        <ellipse cx="50" cy="46.5" rx="4" ry="3"  fill="#F8A8B0"/>

        <!-- Cheeks -->
        <ellipse cx="14" cy="56" rx="10" ry="7" fill="#FF6060" opacity=".25"/>
        <ellipse cx="86" cy="56" rx="10" ry="7" fill="#FF6060" opacity=".25"/>

        <!-- Big happy smile -->
        <path d="M 36 66 Q 50 78 64 66" stroke="#2A7010" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>

      <svg class="hole-svg" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="30" rx="55" ry="25" fill="#5CB832"/>
        <ellipse cx="60" cy="32" rx="45" ry="18" fill="#3E2723"/>
        <ellipse cx="60" cy="35" rx="35" ry="12" fill="#261412"/>
      </svg>
    </div>
    <label>打中 ✓ hit</label>
  </div>

  <!-- ── 放大欣賞 ──────────────────────────────────── -->
  <div class="card">
    <svg style="width:180px" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bodyB" cx="50%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#A0622A"/>
          <stop offset="100%" stop-color="#6B3A10"/>
        </radialGradient>
        <radialGradient id="faceB" cx="40%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#FDDEA8"/>
          <stop offset="55%" stop-color="#F0B86A"/>
          <stop offset="100%" stop-color="#D98A3A"/>
        </radialGradient>
      </defs>

      <path d="M 22 150 C 22 84, 78 84, 78 150 Z" fill="url(#bodyB)"/>
      <ellipse cx="12" cy="92" rx="15" ry="9" fill="#9A5828" transform="rotate(-12,12,92)"/>
      <ellipse cx="1"  cy="87" rx="4" ry="5.5" fill="#7A3810" transform="rotate(-20,1,87)"/>
      <ellipse cx="7"  cy="84" rx="4" ry="5.5" fill="#7A3810" transform="rotate(-12,7,84)"/>
      <ellipse cx="14" cy="83" rx="4" ry="5.5" fill="#7A3810" transform="rotate(-5,14,83)"/>
      <ellipse cx="88" cy="92" rx="15" ry="9" fill="#9A5828" transform="rotate(12,88,92)"/>
      <ellipse cx="99" cy="87" rx="4" ry="5.5" fill="#7A3810" transform="rotate(20,99,87)"/>
      <ellipse cx="93" cy="84" rx="4" ry="5.5" fill="#7A3810" transform="rotate(12,93,84)"/>
      <ellipse cx="86" cy="83" rx="4" ry="5.5" fill="#7A3810" transform="rotate(5,86,83)"/>

      <circle cx="50" cy="44" r="44" fill="url(#bodyB)"/>
      <ellipse cx="50" cy="52" rx="32" ry="34" fill="url(#faceB)"/>
      <ellipse cx="36" cy="30" rx="18" ry="14" fill="#FDEBD0" opacity=".35"/>

      <circle cx="13" cy="10" r="13" fill="#6B3A14"/>
      <circle cx="87" cy="10" r="13" fill="#6B3A14"/>
      <circle cx="13" cy="10" r="8"  fill="#F09070"/>
      <circle cx="87" cy="10" r="8"  fill="#F09070"/>

      <ellipse cx="30" cy="32" rx="13" ry="14" fill="white"/>
      <circle  cx="32" cy="34" r="10"  fill="#1C1008"/>
      <circle  cx="39" cy="25" r="5.5" fill="white"/>
      <circle  cx="28" cy="39" r="2"   fill="white" opacity=".55"/>
      <ellipse cx="70" cy="32" rx="13" ry="14" fill="white"/>
      <circle  cx="68" cy="34" r="10"  fill="#1C1008"/>
      <circle  cx="61" cy="25" r="5.5" fill="white"/>
      <circle  cx="72" cy="39" r="2"   fill="white" opacity=".55"/>

      <text x="50" y="58" font-family="sans-serif" font-size="26" font-weight="bold"
            fill="#CC2200" text-anchor="middle">ㄅ</text>

      <ellipse cx="50" cy="48" rx="6.5" ry="5.5" fill="#E07880"/>
      <ellipse cx="50" cy="46.5" rx="4" ry="3"  fill="#F8A8B0"/>

      <ellipse cx="14" cy="56" rx="10" ry="7" fill="#FF6060" opacity=".22"/>
      <ellipse cx="86" cy="56" rx="10" ry="7" fill="#FF6060" opacity=".22"/>

      <ellipse cx="50" cy="67" rx="6"  ry="5.5" fill="#2E1208"/>
      <ellipse cx="50" cy="66" rx="4.5" ry="4" fill="#C04050"/>
      <ellipse cx="50" cy="65" rx="3"  ry="2"  fill="#E06070" opacity=".6"/>
    </svg>
    <label>放大欣賞</label>
  </div>

</div>

<p style="color:rgba(255,255,255,.75); font-size:.82rem; text-align:center; margin-top: 4px;">
  左：在洞口效果 ／ 中：打中時 ／ 右：放大
</p>

</body>
</html>
