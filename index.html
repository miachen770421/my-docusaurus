<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打地鼠學注音！</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', '微軟正黑體', '蘋方-繁', sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background decorations */
    body::before {
      content: '⭐✨🌟⭐✨🌟';
      position: fixed;
      top: 10px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 1.5rem;
      opacity: 0.4;
      letter-spacing: 1rem;
    }

    h1 {
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 3px 3px 0 #f76d6d, 5px 5px 0 rgba(0,0,0,0.1);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    /* HUD */
    .hud {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hud-box {
      background: #fff;
      border-radius: 20px;
      padding: 10px 24px;
      font-size: 1.3rem;
      font-weight: 900;
      color: #444;
      box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    }

    .hud-box span {
      color: #f76d6d;
    }

    /* Target */
    .target-box {
      background: linear-gradient(135deg, #fff9c4, #ffe082);
      border: 4px solid #f9a825;
      border-radius: 24px;
      padding: 14px 36px;
      font-size: 1.6rem;
      font-weight: 900;
      color: #5d4037;
      margin-bottom: 22px;
      text-align: center;
      box-shadow: 0 6px 0 #e65100, 0 8px 16px rgba(0,0,0,0.15);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .target-char {
      font-size: 3rem;
      color: #e53935;
      display: inline-block;
      animation: bounce 0.6s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-6px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.03); }
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    /* Hole */
    .hole-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hole {
      width: 110px;
      height: 110px;
      background: radial-gradient(ellipse at center, #5d4037 0%, #3e2723 80%);
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      box-shadow: 0 8px 0 #1a0000, inset 0 -4px 12px rgba(0,0,0,0.4);
      overflow: hidden;
      transition: transform 0.1s;
    }

    .hole:active {
      transform: scale(0.93);
    }

    /* Mole */
    .mole {
      position: absolute;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 90px;
      background: linear-gradient(160deg, #a5d6a7, #66bb6a);
      border-radius: 50% 50% 40% 40%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 900;
      color: #1b5e20;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
      transition: bottom 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      cursor: pointer;
      box-shadow: 0 -4px 8px rgba(0,0,0,0.2);
    }

    .mole::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 18px;
      width: 12px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 30px 0 0 #fff;
    }

    .mole::after {
      content: '';
      position: absolute;
      top: 13px;
      left: 21px;
      width: 6px;
      height: 7px;
      background: #333;
      border-radius: 50%;
      box-shadow: 30px 0 0 #333;
      z-index: 1;
    }

    .mole .char {
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    .hole.up .mole {
      bottom: 5%;
    }

    /* Hit animation */
    .mole.hit {
      animation: hitAnim 0.35s forwards;
    }

    @keyframes hitAnim {
      0%   { transform: translateX(-50%) scale(1); filter: brightness(1); }
      30%  { transform: translateX(-50%) scale(1.3); filter: brightness(1.6); }
      100% { transform: translateX(-50%) scale(0); filter: brightness(2); }
    }

    /* Wrong flash */
    .hole.wrong .mole {
      animation: wrongAnim 0.3s forwards;
    }
    @keyframes wrongAnim {
      0%   { filter: brightness(1); }
      50%  { filter: brightness(0.4) sepia(1) saturate(3) hue-rotate(-30deg); }
      100% { filter: brightness(1); }
    }

    /* Floating score */
    .float-score {
      position: fixed;
      font-size: 2rem;
      font-weight: 900;
      pointer-events: none;
      animation: floatUp 0.9s ease-out forwards;
      z-index: 100;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(1.4); }
    }

    /* Timer bar */
    .timer-bar-wrap {
      width: 360px;
      max-width: 92vw;
      height: 18px;
      background: rgba(255,255,255,0.5);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 6px rgba(0,0,0,0.12);
      margin-bottom: 10px;
    }

    .timer-bar {
      height: 100%;
      background: linear-gradient(90deg, #66bb6a, #ffca28, #ef5350);
      border-radius: 12px;
      transition: width 1s linear, background 1s;
      width: 100%;
    }

    /* Start / End overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(4px);
    }

    .overlay.hidden {
      display: none;
    }

    .modal {
      background: #fff;
      border-radius: 32px;
      padding: 44px 40px 36px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .modal h2 {
      font-size: 2rem;
      color: #f76d6d;
      margin-bottom: 10px;
    }

    .modal p {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 22px;
      line-height: 1.6;
    }

    .score-display {
      font-size: 4rem;
      font-weight: 900;
      color: #f9a825;
      text-shadow: 2px 2px 0 #e65100;
      margin: 12px 0;
    }

    .score-label {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 24px;
    }

    .btn {
      background: linear-gradient(135deg, #66bb6a, #43a047);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 44px;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #2e7d32, 0 8px 20px rgba(0,0,0,0.15);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #2e7d32, 0 10px 24px rgba(0,0,0,0.2);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #2e7d32;
    }

    .btn-secondary {
      background: linear-gradient(135deg, #42a5f5, #1e88e5);
      box-shadow: 0 6px 0 #1565c0, 0 8px 20px rgba(0,0,0,0.15);
      margin-top: 12px;
      font-size: 1.1rem;
      padding: 12px 32px;
    }

    .btn-secondary:hover { box-shadow: 0 8px 0 #1565c0, 0 10px 24px rgba(0,0,0,0.2); }
    .btn-secondary:active { box-shadow: 0 3px 0 #1565c0; }

    /* Stars on end screen */
    .stars {
      font-size: 2.2rem;
      letter-spacing: 4px;
      margin: 8px 0;
    }

    /* Responsive */
    @media (max-width: 400px) {
      h1 { font-size: 1.6rem; }
      .hole { width: 85px; height: 85px; }
      .mole { width: 70px; height: 70px; font-size: 2rem; }
      .grid { gap: 12px; }
      .target-char { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <!-- Start overlay -->
  <div class="overlay" id="startOverlay">
    <div class="modal">
      <h2>打地鼠學注音！</h2>
      <p>畫面會顯示一個注音符號<br>快快點擊出現的地鼠<br>找到正確的注音！</p>
      <p style="font-size:0.95rem;color:#aaa">⏱ 遊戲時間：30 秒</p>
      <br>
      <button class="btn" id="startBtn">開始遊戲 🎮</button>
    </div>
  </div>

  <!-- End overlay -->
  <div class="overlay hidden" id="endOverlay">
    <div class="modal">
      <h2 id="endTitle">時間到！</h2>
      <div class="stars" id="endStars">⭐⭐⭐</div>
      <div class="score-display" id="finalScore">0</div>
      <div class="score-label">分！</div>
      <p id="endMessage">做得很棒！繼續加油！</p>
      <button class="btn" id="replayBtn">再玩一次 🔄</button>
      <br>
      <button class="btn btn-secondary" id="speakScoreBtn">朗讀得分 🔊</button>
    </div>
  </div>

  <!-- Game UI -->
  <h1>🐾 打地鼠學注音！</h1>

  <div class="hud">
    <div class="hud-box">⏱ <span id="timerDisplay">30</span> 秒</div>
    <div class="hud-box">⭐ <span id="scoreDisplay">0</span> 分</div>
  </div>

  <div class="target-box">
    請找：<span class="target-char" id="targetChar">ㄅ</span>
  </div>

  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <div class="grid" id="grid">
    <!-- 6 holes generated by JS -->
  </div>

  <script>
    // ── Zhuyin symbols ────────────────────────────────────────────────────────
    const ZHUYIN = [
      'ㄅ','ㄆ','ㄇ','ㄈ',
      'ㄉ','ㄊ','ㄋ','ㄌ',
      'ㄍ','ㄎ','ㄏ',
      'ㄐ','ㄑ','ㄒ',
      'ㄓ','ㄔ','ㄕ','ㄖ',
      'ㄗ','ㄘ','ㄙ',
      'ㄧ','ㄨ','ㄩ',
      'ㄚ','ㄛ','ㄜ',
      'ㄞ','ㄟ','ㄠ','ㄡ',
      'ㄢ','ㄣ','ㄤ','ㄥ','ㄦ'
    ];

    const GAME_TIME = 30;
    const HOLES_COUNT = 6;
    const MOLE_SHOW_MS = 1100;   // how long a mole stays up
    const SPAWN_INTERVAL = 900;  // ms between spawns

    // ── State ─────────────────────────────────────────────────────────────────
    let score = 0;
    let timeLeft = GAME_TIME;
    let targetChar = '';
    let holes = [];
    let moleTimers = [];
    let spawnTimer = null;
    let countdownTimer = null;
    let gameRunning = false;

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const grid          = document.getElementById('grid');
    const timerDisplay  = document.getElementById('timerDisplay');
    const scoreDisplay  = document.getElementById('scoreDisplay');
    const targetEl      = document.getElementById('targetChar');
    const timerBar      = document.getElementById('timerBar');
    const startOverlay  = document.getElementById('startOverlay');
    const endOverlay    = document.getElementById('endOverlay');
    const finalScore    = document.getElementById('finalScore');
    const endMessage    = document.getElementById('endMessage');
    const endStars      = document.getElementById('endStars');
    const endTitle      = document.getElementById('endTitle');

    // ── Build holes ───────────────────────────────────────────────────────────
    for (let i = 0; i < HOLES_COUNT; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'hole-wrap';

      const hole = document.createElement('div');
      hole.className = 'hole';
      hole.dataset.index = i;

      const mole = document.createElement('div');
      mole.className = 'mole';

      const charSpan = document.createElement('span');
      charSpan.className = 'char';
      mole.appendChild(charSpan);
      hole.appendChild(mole);
      wrap.appendChild(hole);
      grid.appendChild(wrap);
      holes.push({ hole, mole, charSpan, up: false, char: '' });
    }

    // ── Utilities ─────────────────────────────────────────────────────────────
    function rand(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function pickTarget() {
      return rand(ZHUYIN);
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 0.85;
      utter.pitch = 1.2;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    function showFloat(x, y, text, color) {
      const el = document.createElement('div');
      el.className = 'float-score';
      el.textContent = text;
      el.style.color = color;
      el.style.left = `${x}px`;
      el.style.top  = `${y}px`;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    // ── Mole logic ────────────────────────────────────────────────────────────
    function hideMole(idx) {
      const h = holes[idx];
      h.hole.classList.remove('up');
      h.up = false;
      h.char = '';
      clearTimeout(moleTimers[idx]);
    }

    function spawnMoles() {
      if (!gameRunning) return;

      // Pick 1–2 random holes that are currently empty
      const emptyIdxs = holes
        .map((h, i) => h.up ? null : i)
        .filter(i => i !== null);

      const count = Math.min(emptyIdxs.length, Math.random() < 0.4 ? 2 : 1);
      for (let c = 0; c < count; c++) {
        const idx = emptyIdxs.splice(
          Math.floor(Math.random() * emptyIdxs.length), 1
        )[0];
        if (idx === undefined) continue;

        // 40% chance it shows the target symbol
        const showTarget = Math.random() < 0.40;
        let sym = showTarget
          ? targetChar
          : rand(ZHUYIN.filter(z => z !== targetChar));

        const h = holes[idx];
        h.char = sym;
        h.charSpan.textContent = sym;
        h.up = true;
        h.hole.classList.add('up');

        // Auto-hide after MOLE_SHOW_MS
        moleTimers[idx] = setTimeout(() => {
          if (h.up) hideMole(idx);
        }, MOLE_SHOW_MS);
      }
    }

    // ── Click handler ─────────────────────────────────────────────────────────
    grid.addEventListener('click', e => {
      if (!gameRunning) return;
      const moleEl = e.target.closest('.mole');
      if (!moleEl) return;

      const holeEl = moleEl.parentElement;
      const idx    = parseInt(holeEl.dataset.index);
      const h      = holes[idx];
      if (!h.up) return;

      const rect = moleEl.getBoundingClientRect();
      const cx   = rect.left + rect.width / 2;
      const cy   = rect.top;

      if (h.char === targetChar) {
        // Correct!
        score++;
        scoreDisplay.textContent = score;
        moleEl.classList.add('hit');
        hideMole(idx);
        showFloat(cx - 20, cy, `+1 ✨`, '#f9a825');
        playBeep(800, 0.1, 'sine');

        // Every 3 correct answers, announce new target
        if (score % 3 === 0) {
          setTimeout(() => {
            targetChar = pickTarget();
            targetEl.textContent = targetChar;
            speak(`請找 ${targetChar}`);
          }, 400);
        }
      } else {
        // Wrong
        holeEl.classList.add('wrong');
        showFloat(cx - 20, cy, `✗`, '#ef5350');
        playBeep(220, 0.12, 'sawtooth');
        setTimeout(() => holeEl.classList.remove('wrong'), 350);
      }
    });

    // ── Simple beep via Web Audio ─────────────────────────────────────────────
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) {}
      }
      return audioCtx;
    }

    function playBeep(freq, dur, type = 'sine') {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    }

    // ── Game control ──────────────────────────────────────────────────────────
    function startGame() {
      score     = 0;
      timeLeft  = GAME_TIME;
      gameRunning = true;

      scoreDisplay.textContent = '0';
      timerDisplay.textContent = GAME_TIME;
      timerBar.style.width = '100%';

      targetChar = pickTarget();
      targetEl.textContent = targetChar;
      speak(`開始！請找 ${targetChar}`);

      startOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');

      // Countdown
      countdownTimer = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        timerBar.style.width = `${(timeLeft / GAME_TIME) * 100}%`;
        if (timeLeft <= 0) endGame();
      }, 1000);

      // Spawn moles
      spawnTimer = setInterval(spawnMoles, SPAWN_INTERVAL);
    }

    function endGame() {
      gameRunning = false;
      clearInterval(countdownTimer);
      clearInterval(spawnTimer);
      moleTimers.forEach(clearTimeout);

      // Hide all moles
      holes.forEach((_, i) => hideMole(i));

      // Stars
      let stars = '⭐';
      let msg   = '繼續練習，你可以更棒的！';
      if (score >= 20)      { stars = '⭐⭐⭐'; msg = '太厲害了！你是注音小達人！🎉'; }
      else if (score >= 12) { stars = '⭐⭐';   msg = '做得很棒！繼續加油！😊';      }
      else if (score >= 6)  { stars = '⭐';     msg = '不錯喔！再練習一下！💪';      }

      endTitle.textContent = '時間到！';
      endStars.textContent = stars;
      finalScore.textContent = score;
      endMessage.textContent = msg;
      endOverlay.classList.remove('hidden');

      playBeep(523, 0.15);
      setTimeout(() => playBeep(659, 0.15), 180);
      setTimeout(() => playBeep(784, 0.3), 360);

      speak(`遊戲結束！你得了 ${score} 分！${msg}`);
    }

    // ── Buttons ───────────────────────────────────────────────────────────────
    document.getElementById('startBtn').addEventListener('click', () => {
      getAudioCtx(); // unlock audio on user gesture
      startGame();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      getAudioCtx();
      startGame();
    });

    document.getElementById('speakScoreBtn').addEventListener('click', () => {
      speak(`你得了 ${score} 分！`);
    });
  </script>
</body>
</html>
