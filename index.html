<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>ㄅㄆㄇ 打地鼠</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: '微軟正黑體', '蘋方-繁', 'PingFang TC', sans-serif;
      background: linear-gradient(160deg, #81D4FA 0%, #A5D6A7 55%, #C8E6C9 100%);
      height: 100dvh;           /* fill exact viewport, no scroll */
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 8px 6px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Title ───────────────────────────────────────────── */
    .game-title {
      font-size: clamp(1.1rem, 4.5vw, 1.8rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 2px 2px 0 #f76d6d, 4px 4px 0 rgba(0,0,0,0.12);
      margin-bottom: 6px;
      letter-spacing: 3px;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── HUD ─────────────────────────────────────────────── */
    .hud {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      justify-content: center;
      flex-shrink: 0;
    }

    .hud-box {
      background: rgba(255,255,255,0.92);
      border-radius: 14px;
      padding: 4px 14px;
      font-size: 0.8rem;
      font-weight: 900;
      color: #555;
      box-shadow: 0 3px 0 rgba(0,0,0,0.1);
      min-width: 76px;
      text-align: center;
    }

    .hud-box .val {
      font-size: 1.25rem;
      color: #E53935;
      display: block;
      line-height: 1.1;
    }

    /* ── Timer bar ───────────────────────────────────────── */
    .timer-bar-wrap {
      width: 100%;
      max-width: 400px;
      height: 10px;
      background: rgba(255,255,255,0.5);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 6px;
      flex-shrink: 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
    }

    .timer-bar {
      height: 100%;
      background: linear-gradient(90deg, #66BB6A, #FFA726, #EF5350);
      border-radius: 10px;
      transition: width 1s linear;
      width: 100%;
    }

    /* ── Target box ──────────────────────────────────────── */
    .target-box {
      background: linear-gradient(135deg, #FFFDE7, #FFF9C4);
      border: 3px solid #F9A825;
      border-radius: 16px;
      padding: 4px 20px 6px;
      margin-bottom: 4px;
      text-align: center;
      flex-shrink: 0;
      box-shadow: 0 4px 0 #F57F17, 0 6px 10px rgba(0,0,0,0.1);
    }

    .target-label {
      font-size: 0.75rem;
      color: #795548;
      margin-bottom: 0;
    }

    .target-char {
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      font-weight: 900;
      color: #E53935;
      display: block;
      line-height: 1.1;
      animation: charBounce 0.9s ease-in-out infinite alternate;
    }

    @keyframes charBounce {
      from { transform: scale(1);    }
      to   { transform: scale(1.14); }
    }

    /* ── Difficulty badge ────────────────────────────────── */
    .difficulty-badge {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.18);
      border-radius: 10px;
      padding: 2px 10px;
      margin-bottom: 5px;
      flex-shrink: 0;
    }

    /* ── Grid ────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr); /* rows share remaining height equally */
      gap: 6px;
      width: 100%;
      max-width: 420px;
      flex: 1;        /* fill leftover viewport height */
      min-height: 0;  /* allow flex child to shrink */
    }

    /* ── Hole cell ───────────────────────────────────────── */
    /*
     * Structure (z-order):
     *   .hole-cell  (relative, overflow:hidden → clips mole when below)
     *     .mole-graphic   (z:1, slides up/down)
     *     .hole-graphic   (z:2, always on top → covers lower mole body)
     *
     * Mole SVG layout (viewBox 0 0 100 150):
     *   y=0–78  → head+face (52 %) — appears ABOVE hole rim
     *   y=78–150 → fur cone (48 %) — hidden BEHIND hole graphic
     * So face will always sit just above the hole regardless of cell height.
     */
    .hole-cell {
      position: relative;
      min-height: 0;   /* allow grid row to shrink */
      cursor: pointer;
      overflow: hidden;
    }

    /* ── Hole SVG ────────────────────────────────────────── */
    .hole-graphic {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* ── Mole ────────────────────────────────────────────── */
    .mole-graphic {
      position: absolute;
      /*
       * bottom≈0 so the mole body (bottom 48% of SVG) sits inside the hole.
       * The hole graphic is ~50% of cell width tall and covers this area.
       * The face (top 52%) then peeks above the hole rim naturally.
       */
      bottom: 0;
      left: 50%;
      width: clamp(65px, 17vw, 88px);
      z-index: 1;
      transform: translateX(-50%) translateY(calc(100% + 20px));
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .hole-cell.up .mole-graphic {
      transform: translateX(-50%) translateY(0);
    }

    /* ── Hit animation (correct answer) ─────────────────── */
    .hole-cell.hit .mole-graphic {
      animation: hitPop 0.45s ease-out forwards;
    }

    @keyframes hitPop {
      0%   { transform: translateX(-50%) translateY(0) scale(1);    filter: brightness(1);   }
      35%  { transform: translateX(-50%) translateY(-16px) scale(1.3); filter: brightness(1.5); }
      100% { transform: translateX(-50%) translateY(calc(100% + 40px)) scale(0.7); opacity: 0; }
    }

    /* ── Wrong animation (wrong answer → quick retreat) ─── */
    .hole-cell.wrong .mole-graphic {
      animation: wrongRetreat 0.22s ease-in forwards;
    }

    @keyframes wrongRetreat {
      from { transform: translateX(-50%) translateY(0); }
      to   { transform: translateX(-50%) translateY(calc(100% + 40px)); }
    }

    /* ── Floating score label ────────────────────────────── */
    .float-score {
      position: fixed;
      font-size: 1.7rem;
      font-weight: 900;
      pointer-events: none;
      animation: floatUp 0.85s ease-out forwards;
      z-index: 500;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1);   }
      100% { opacity: 0; transform: translateY(-65px) scale(1.4); }
    }

    /* ── Overlays ────────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .overlay.hidden {
      display: none;
    }

    .modal {
      background: #fff;
      border-radius: 28px;
      padding: 32px 28px 26px;
      text-align: center;
      max-width: 310px;
      width: 88%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.28);
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .modal-icon   { font-size: 3rem; margin-bottom: 6px; }
    .modal-title  { font-size: 1.7rem; font-weight: 900; color: #E53935; margin-bottom: 8px; }

    .modal-desc {
      font-size: 0.95rem;
      color: #666;
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .modal-score {
      font-size: 3.2rem;
      font-weight: 900;
      color: #F9A825;
      text-shadow: 2px 2px 0 #E65100;
      margin: 6px 0 2px;
    }

    .modal-score-label { font-size: 1rem; color: #aaa; margin-bottom: 10px; }

    .stars { font-size: 2rem; letter-spacing: 4px; margin: 4px 0 14px; }

    .modal-message { font-size: 0.95rem; color: #555; margin-bottom: 20px; }

    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #66BB6A, #43A047);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #2E7D32;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
      min-height: 60px;
    }

    .btn:hover  { transform: translateY(-2px); box-shadow: 0 7px 0 #2E7D32; }
    .btn:active { transform: translateY(2px);  box-shadow: 0 3px 0 #2E7D32; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (min-width: 500px) {
      .grid { max-width: 460px; }
    }
  </style>
</head>

  <!-- ── Start overlay ──────────────────────────────────── -->
  <div class="overlay" id="startOverlay">
    <div class="modal">
      <div class="modal-icon">🐾</div>
      <div class="modal-title">ㄅㄆㄇ 打地鼠</div>
      <div class="modal-desc">
        聽聲音，找到正確的注音符號<br>
        快快點擊那隻地鼠！<br>
        <span style="font-size:0.85rem;color:#aaa">⏱ 遊戲時間：60 秒</span>
      </div>
      <button class="btn" id="startBtn" data-testid="start-btn">開始遊戲</button>
    </div>
  </div>

      <button class="btn" id="replayBtn" data-testid="replay-btn">再來一次</button>
    </div>
  </div>

  <div class="grid" id="grid">

    // ── Progressive difficulty pools ───────────────────────────────────────────
    // All 37 standard Zhuyin symbols split into 5 unlockable pools

    const ZHUYIN_POOLS = [
      ['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ'],              // 0 s  → 8  chars
      ['ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ'],                        // 15 s → +6 = 14
      ['ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ'],                   // 30 s → +7 = 21
      ['ㄧ','ㄨ','ㄩ','ㄚ','ㄛ','ㄜ','ㄝ'],                   // 45 s → +7 = 28
      ['ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ'],          // 55 s → +9 = 37
    ];
    const POOL_UNLOCK_TIMES = [0, 15, 30, 45, 55]; // elapsed seconds

    // ── Constants ──────────────────────────────────────────────────────────────
    const GAME_DURATION   = 60;   // seconds
    const MOLE_VISIBLE_MS = 2000; // how long a mole stays up
    const POST_SPEAK_DELAY = 650; // ms after speech before moles appear

    // ── State ──────────────────────────────────────────────────────────────────
    let score          = 0;
    let timeLeft       = GAME_DURATION;
    let elapsedTime    = 0;
    let targetChar     = '';
    let activePool     = [...ZHUYIN_POOLS[0]];
    let poolLevel      = 0;
    let holes          = [];       // array of hole objects
    let moleTimers     = [];       // per-hole auto-hide timers
    let countdownTimer = null;
    let gameRunning    = false;
    let roundActive    = false;    // prevents overlapping rounds

    // ── DOM references ─────────────────────────────────────────────────────────
    const grid             = document.getElementById('grid');
    const timerDisplay     = document.getElementById('timerDisplay');
    const scoreDisplay     = document.getElementById('scoreDisplay');
    const targetEl         = document.getElementById('targetChar');
    const timerBar         = document.getElementById('timerBar');
    const startOverlay     = document.getElementById('startOverlay');
    const endOverlay       = document.getElementById('endOverlay');
    const finalScore       = document.getElementById('finalScore');
    const endMessage       = document.getElementById('endMessage');
    const endStars         = document.getElementById('endStars');
    const difficultyBadge  = document.getElementById('difficultyBadge');

    // ── Build 9 holes ──────────────────────────────────────────────────────────
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'hole-cell';
      cell.dataset.index = i;
      cell.setAttribute('data-testid', `mole-hole-${i + 1}`);

      // Mole (z-index 1, behind hole graphic)
      const moleDiv = document.createElement('div');
      moleDiv.className = 'mole-graphic';
      moleDiv.setAttribute('data-testid', 'mole-character');
      moleDiv.innerHTML = MOLE_NORMAL_SVG;

      // Hole oval (z-index 2, always on top)
      const holeDiv = document.createElement('div');
      holeDiv.className = 'hole-graphic';
      holeDiv.innerHTML = HOLE_SVG;

      cell.appendChild(moleDiv);
      cell.appendChild(holeDiv);
      grid.appendChild(cell);

      holes.push({
        cell,
        moleDiv,
        up: false,
        char: '',
        isTarget: false,
      });
      moleTimers.push(null);
    }

    // ── Audio ──────────────────────────────────────────────────────────────────
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { /* not supported */ }
      }
      return audioCtx;
    }

    function playTone(freq, dur, type = 'sine', vol = 0.28) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    }

    function playSuccessSound() {
      playTone(523, 0.12);
      setTimeout(() => playTone(659, 0.12), 110);
      setTimeout(() => playTone(784, 0.22), 220);
    }

    function playErrorSound() {
      playTone(300, 0.09, 'sawtooth', 0.15);
      setTimeout(() => playTone(220, 0.14, 'sawtooth', 0.10), 90);
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang  = 'zh-TW';
      utter.rate  = 0.80;
      utter.pitch = 1.35;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    // ── Utilities ──────────────────────────────────────────────────────────────
    function randItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffled(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showFloatingScore(x, y, text, color) {
      const el = document.createElement('div');
      el.className   = 'float-score';
      el.textContent = text;
      el.style.color = color;
      el.style.left  = `${x}px`;
      el.style.top   = `${y}px`;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function setMoleSvg(holeObj, svgString, char) {
      holeObj.moleDiv.innerHTML = svgString;
      holeObj.moleDiv.querySelector('text').textContent = char;
    }

    // ── Progressive difficulty ─────────────────────────────────────────────────
    function updatePool() {
      let changed = false;
      for (let lvl = poolLevel + 1; lvl < POOL_UNLOCK_TIMES.length; lvl++) {
        if (elapsedTime >= POOL_UNLOCK_TIMES[lvl]) {
          activePool = [...activePool, ...ZHUYIN_POOLS[lvl]];
          poolLevel  = lvl;
          changed    = true;
        }
      }
      if (changed) {
        difficultyBadge.textContent = `練習中：${activePool.length} 個注音`;
      }
    }

    // ── Mole management ───────────────────────────────────────────────────────
    function hideMole(idx) {
      const h = holes[idx];
      if (!h.up) return;
      clearTimeout(moleTimers[idx]);
      h.cell.classList.remove('up');
      h.up       = false;
      h.char     = '';
      h.isTarget = false;
      setTimeout(() => setMoleSvg(h, MOLE_NORMAL_SVG, ''), 280);
    }

    function hideAllMoles() {
      holes.forEach((_, i) => {
        clearTimeout(moleTimers[i]);
        const h = holes[i];
        h.cell.classList.remove('up', 'hit', 'wrong');
        h.up = false; h.char = ''; h.isTarget = false;
        setMoleSvg(h, MOLE_NORMAL_SVG, '');
      });
    }

    // ── Round logic ───────────────────────────────────────────────────────────
    function startRound() {
      if (!gameRunning || roundActive) return;
      roundActive = true;

      // Choose a new target from the active pool
      targetChar = randItem(activePool);
      targetEl.textContent = targetChar;

      // Announce via speech synthesis
      speak(targetChar);

      // Spawn moles after brief delay (let speech start)
      setTimeout(() => {
        if (!gameRunning) return;
        spawnMoles();
      }, POST_SPEAK_DELAY);
    }

    function spawnMoles() {
      // 1–3 moles per round
      const count       = Math.floor(Math.random() * 3) + 1;
      const indices     = shuffled([0,1,2,3,4,5,6,7,8]).slice(0, count);
      const targetIndex = randItem(indices);
      const distractors = activePool.filter(z => z !== targetChar);

      indices.forEach(idx => {
        const h      = holes[idx];
        const isTgt  = (idx === targetIndex);
        const char   = isTgt ? targetChar : randItem(distractors);

        h.char     = char;
        h.isTarget = isTgt;
        h.up       = true;

        setMoleSvg(h, MOLE_NORMAL_SVG, char);
        h.cell.classList.add('up');

        // Auto-hide after visible window
        moleTimers[idx] = setTimeout(() => {
          if (h.up) {
            hideMole(idx);
            checkRoundComplete();
          }
        }, MOLE_VISIBLE_MS);
      });
    }

    function checkRoundComplete() {
      // If all moles have retreated, start next round
      if (!holes.some(h => h.up) && gameRunning) {
        roundActive = false;
        setTimeout(startRound, 350);
      }
    }

    // ── Interaction handler ────────────────────────────────────────────────────
    function handleMoleClick(e) {
      if (!gameRunning) return;
      const cell = e.target.closest('.hole-cell');
      if (!cell) return;

      const idx = parseInt(cell.dataset.index);
      const h   = holes[idx];
      if (!h.up) return;

      const rect = cell.getBoundingClientRect();
      const cx   = rect.left + rect.width  / 2;
      const cy   = rect.top  + rect.height / 3;

      if (h.isTarget) {
        // ── Correct ──
        score += 10;
        scoreDisplay.textContent = score;

        clearTimeout(moleTimers[idx]);
        h.up = false;
        setMoleSvg(h, MOLE_HAPPY_SVG, h.char);
        h.cell.classList.remove('up');
        h.cell.classList.add('hit');

        showFloatingScore(cx - 22, cy, '+10 ✨', '#F9A825');
        playSuccessSound();

        setTimeout(() => {
          h.cell.classList.remove('hit');
          h.char = ''; h.isTarget = false;
          setMoleSvg(h, MOLE_NORMAL_SVG, '');
          hideAllMoles();
          roundActive = false;
          if (gameRunning) startRound();
        }, 480);

      } else {
        // ── Wrong: mole immediately retreats ──
        clearTimeout(moleTimers[idx]);
        h.up       = false;
        h.isTarget = false;
        h.cell.classList.add('wrong');
        playErrorSound();

        setTimeout(() => {
          h.cell.classList.remove('wrong', 'up');
          h.char = '';
          setMoleSvg(h, MOLE_NORMAL_SVG, '');
          checkRoundComplete();
        }, 250);
      }
    }

    grid.addEventListener('click', handleMoleClick);

    // Touch: bypass 300 ms delay and prevent accidental double-fire
    grid.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t  = e.changedTouches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      if (el) el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }, { passive: false });

    // ── Game lifecycle ─────────────────────────────────────────────────────────
    function startGame() {
      score       = 0;
      timeLeft    = GAME_DURATION;
      elapsedTime = 0;
      poolLevel   = 0;
      activePool  = [...ZHUYIN_POOLS[0]];
      gameRunning = true;
      roundActive = false;

      scoreDisplay.textContent  = '0';
      timerDisplay.textContent  = GAME_DURATION;
      timerBar.style.width      = '100%';
      difficultyBadge.textContent = `練習中：${activePool.length} 個注音`;

      hideAllMoles();
      startOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');

      // Countdown tick every second
      countdownTimer = setInterval(() => {
        timeLeft--;
        elapsedTime++;
        timerDisplay.textContent = timeLeft;
        timerBar.style.width     = `${(timeLeft / GAME_DURATION) * 100}%`;
        updatePool();
        if (timeLeft <= 0) endGame();
      }, 1000);

      // Kick off first round after a moment
      setTimeout(startRound, 400);
    }

    function endGame() {
      gameRunning = false;
      roundActive = false;
      clearInterval(countdownTimer);
      moleTimers.forEach(clearTimeout);
      hideAllMoles();

      // Star rating
      let stars, msg;
      if (score >= 100) {
        stars = '⭐⭐⭐'; msg = '太厲害了！你是注音小達人！🎉';
      } else if (score >= 50) {
        stars = '⭐⭐';   msg = '做得很棒！繼續加油！😊';
      } else {
        stars = '⭐';     msg = '不錯喔！再練習一下！💪';
      }

      endStars.textContent   = stars;
      finalScore.textContent = score;
      endMessage.textContent = msg;
      endOverlay.classList.remove('hidden');

      // Victory fanfare
      playTone(523, 0.14);
      setTimeout(() => playTone(659, 0.14), 170);
      setTimeout(() => playTone(784, 0.28), 340);

      speak(`遊戲結束！你得了 ${score} 分！`);
    }

    // ── Buttons ────────────────────────────────────────────────────────────────
    document.getElementById('startBtn').addEventListener('click', () => {
      getAudioCtx(); // unlock AudioContext on user gesture
      startGame();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      getAudioCtx();
      startGame();
    });
  </script>
</body>
</html>
