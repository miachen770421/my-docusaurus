<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>ㄅㄆㄇ 打地鼠</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: '微軟正黑體', '蘋方-繁', 'PingFang TC', sans-serif;
      background: linear-gradient(160deg, #81D4FA 0%, #A5D6A7 55%, #C8E6C9 100%);
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 8px 6px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Title ─────────────────────────────────────────── */
    .game-title {
      font-size: clamp(1.1rem, 4.5vw, 1.8rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 2px 2px 0 #f76d6d, 4px 4px 0 rgba(0,0,0,0.12);
      margin-bottom: 6px;
      letter-spacing: 3px;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── HUD ───────────────────────────────────────────── */
    .hud {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      justify-content: center;
      flex-shrink: 0;
    }

    .hud-box {
      background: rgba(255,255,255,0.92);
      border-radius: 14px;
      padding: 4px 14px;
      font-size: 0.8rem;
      font-weight: 900;
      color: #555;
      box-shadow: 0 3px 0 rgba(0,0,0,0.1);
      min-width: 76px;
      text-align: center;
    }

    .hud-box .val {
      font-size: 1.25rem;
      color: #E53935;
      display: block;
      line-height: 1.1;
    }

    .hud-box.hidden, .timer-bar-wrap.hidden { display: none; }

    /* ── Timer bar ─────────────────────────────────────── */
    .timer-bar-wrap {
      width: 100%;
      max-width: 400px;
      height: 10px;
      background: rgba(255,255,255,0.5);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 6px;
      flex-shrink: 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
    }

    .timer-bar {
      height: 100%;
      background: linear-gradient(90deg, #66BB6A, #FFA726, #EF5350);
      border-radius: 10px;
      transition: width 1s linear;
      width: 100%;
    }

    /* ── Target box ────────────────────────────────────── */
    .target-box {
      background: linear-gradient(135deg, #FFFDE7, #FFF9C4);
      border: 3px solid #F9A825;
      border-radius: 16px;
      padding: 4px 20px 6px;
      margin-bottom: 4px;
      text-align: center;
      flex-shrink: 0;
      box-shadow: 0 4px 0 #F57F17, 0 6px 10px rgba(0,0,0,0.1);
    }

    .target-label { font-size: 0.75rem; color: #795548; margin-bottom: 0; }

    .target-char {
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      font-weight: 900;
      color: #E53935;
      display: block;
      line-height: 1.1;
      animation: charBounce 0.9s ease-in-out infinite alternate;
    }

    @keyframes charBounce {
      from { transform: scale(1); }
      to   { transform: scale(1.14); }
    }

    /* ── Difficulty badge ──────────────────────────────── */
    .difficulty-badge {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.18);
      border-radius: 10px;
      padding: 2px 10px;
      margin-bottom: 5px;
      flex-shrink: 0;
    }

    /* ── Grid ──────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 420px;
      flex: 1;
      min-height: 0;
    }

    /* ── Hole cell ─────────────────────────────────────── */
    .hole-cell {
      position: relative;
      min-height: 0;
      cursor: pointer;
      overflow: hidden;
    }

    .hole-graphic {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* ── Mole ──────────────────────────────────────────── */
    .mole-graphic {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: clamp(85px, 22vw, 115px);
      z-index: 1;
      transform: translateX(-50%) translateY(calc(100% + 20px));
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .hole-cell.up .mole-graphic {
      transform: translateX(-50%) translateY(0);
    }

    .hole-cell.hit .mole-graphic {
      animation: hitPop 0.45s ease-out forwards;
    }

    @keyframes hitPop {
      0%   { transform: translateX(-50%) translateY(0) scale(1); filter: brightness(1); }
      35%  { transform: translateX(-50%) translateY(-16px) scale(1.3); filter: brightness(1.5); }
      100% { transform: translateX(-50%) translateY(calc(100% + 40px)) scale(0.7); opacity: 0; }
    }

    .hole-cell.wrong .mole-graphic {
      animation: wrongRetreat 0.22s ease-in forwards;
    }

    @keyframes wrongRetreat {
      from { transform: translateX(-50%) translateY(0); }
      to   { transform: translateX(-50%) translateY(calc(100% + 40px)); }
    }

    /* ── Floating label ────────────────────────────────── */
    .float-score {
      position: fixed;
      font-size: 1.7rem;
      font-weight: 900;
      pointer-events: none;
      animation: floatUp 0.85s ease-out forwards;
      z-index: 500;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-65px) scale(1.4); }
    }

    /* ── Overlays ──────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .overlay.hidden { display: none; }

    .modal {
      background: #fff;
      border-radius: 28px;
      padding: 32px 28px 26px;
      text-align: center;
      max-width: 310px;
      width: 88%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.28);
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .modal-icon  { font-size: 3rem; margin-bottom: 6px; }
    .modal-title { font-size: 1.7rem; font-weight: 900; color: #E53935; margin-bottom: 8px; }

    .modal-desc {
      font-size: 0.95rem;
      color: #666;
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .modal-score {
      font-size: 3.2rem;
      font-weight: 900;
      color: #F9A825;
      text-shadow: 2px 2px 0 #E65100;
      margin: 6px 0 2px;
    }

    .modal-score-label { font-size: 1rem; color: #aaa; margin-bottom: 10px; }
    .stars { font-size: 2rem; letter-spacing: 4px; margin: 4px 0 14px; }
    .modal-message { font-size: 0.95rem; color: #555; margin-bottom: 20px; }

    .end-correct {
      font-size: 1.05rem;
      color: #666;
      margin-bottom: 2px;
    }

    /* ── Buttons ───────────────────────────────────────── */
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #66BB6A, #43A047);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #2E7D32;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
      min-height: 60px;
    }

    .btn:hover  { transform: translateY(-2px); box-shadow: 0 7px 0 #2E7D32; }
    .btn:active { transform: translateY(2px);  box-shadow: 0 3px 0 #2E7D32; }

    .btn-mode {
      font-size: 1.05rem;
      line-height: 1.4;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .btn-mode small {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      opacity: 0.88;
      margin-top: 3px;
    }

    .btn-timed {
      background: linear-gradient(135deg, #42A5F5, #1E88E5);
      box-shadow: 0 5px 0 #1565C0;
    }
    .btn-timed:hover  { transform: translateY(-2px); box-shadow: 0 7px 0 #1565C0; }
    .btn-timed:active { transform: translateY(2px);  box-shadow: 0 3px 0 #1565C0; }

    .btn-back {
      background: transparent;
      color: #aaa;
      box-shadow: none;
      font-size: 0.9rem;
      padding: 8px;
      min-height: unset;
      margin-top: 4px;
    }
    .btn-back:hover  { transform: none; box-shadow: none; color: #777; }
    .btn-back:active { transform: none; box-shadow: none; }

    /* ── Quit button ───────────────────────────────────── */
    .btn-quit {
      background: rgba(255,255,255,0.55);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1rem;
      color: #555;
      cursor: pointer;
      flex-shrink: 0;
      align-self: center;
      transition: background 0.15s;
    }
    .btn-quit:hover  { background: rgba(255,255,255,0.85); }
    .btn-quit:active { background: rgba(255,255,255,1); }

    /* ── Quit confirmation overlay ─────────────────────── */
    .quit-modal-title { font-size: 1.4rem; font-weight: 900; color: #333; margin-bottom: 8px; }
    .quit-modal-desc  { font-size: 0.92rem; color: #888; margin-bottom: 22px; }

    @media (min-width: 500px) { .grid { max-width: 460px; } }
  </style>
</head>
<body>

  <!-- ── Start overlay (mode selection) ─────────────────── -->
  <div class="overlay" id="startOverlay">
    <div class="modal">
      <div class="modal-icon">🐾</div>
      <div class="modal-title">ㄅㄆㄇ 打地鼠</div>
      <div class="modal-desc">選擇遊戲模式</div>
      <button class="btn btn-mode" id="mode1Btn">
        ❤️ 模式一：生存挑戰
        <small>不限時・速度越來越快<br>答錯 3 次遊戲結束，看能得幾分！</small>
      </button>
      <button class="btn btn-mode btn-timed" id="mode2Btn">
        ⏱ 模式二：限時衝分
        <small>60 秒倒數・看能答對幾題！</small>
      </button>
    </div>
  </div>

  <!-- ── End overlay ─────────────────────────────────────── -->
  <div class="overlay hidden" id="endOverlay">
    <div class="modal">
      <div class="modal-title" id="endTitle">遊戲結束！</div>
      <div class="stars" id="endStars">⭐⭐⭐</div>
      <div class="end-correct hidden" id="endCorrectRow">答對 <strong id="finalCorrect">0</strong> 題</div>
      <div class="modal-score" id="finalScore">0</div>
      <div class="modal-score-label">得分</div>
      <div class="modal-message" id="endMessage">做得很棒！</div>
      <button class="btn" id="replayBtn" data-testid="replay-btn">再來一次</button>
      <button class="btn btn-back" id="changeModeBtn">換模式</button>
    </div>
  </div>

  <!-- ── Quit confirmation overlay ──────────────────────── -->
  <div class="overlay hidden" id="quitOverlay">
    <div class="modal">
      <div class="modal-icon">🚪</div>
      <div class="quit-modal-title">要離開遊戲嗎？</div>
      <div class="quit-modal-desc">目前進度將不會儲存</div>
      <button class="btn" id="resumeBtn">繼續遊戲</button>
      <button class="btn btn-back" id="quitConfirmBtn">離開，回選單</button>
    </div>
  </div>

  <!-- ── Game UI ──────────────────────────────────────────── -->
  <h1 class="game-title">ㄅㄆㄇ 打地鼠</h1>

  <div class="hud">
    <button class="btn-quit" id="quitBtn" title="離開遊戲">✕</button>
    <div class="hud-box hidden" id="timerBox">⏱ 時間<span class="val" id="timerDisplay">60</span></div>
    <div class="hud-box hidden" id="livesBox">生命<span class="val" id="livesDisplay">❤️❤️❤️</span></div>
    <div class="hud-box">得分<span class="val" id="scoreDisplay">0</span></div>
  </div>

  <div class="timer-bar-wrap hidden" id="timerBarWrap">
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <div class="target-box">
    <div class="target-label">請點擊：</div>
    <span class="target-char" id="targetChar">ㄅ</span>
  </div>

  <div class="difficulty-badge" id="difficultyBadge">速度 Lv.1　每題 +10 分</div>

  <div class="grid" id="grid"></div>

  <script>
    // ── SVG assets ─────────────────────────────────────────────────────────────

    const HOLE_SVG = `
      <svg viewBox="0 0 120 60" width="100%" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="30" rx="55" ry="25" fill="#7CB342"/>
        <ellipse cx="60" cy="32" rx="45" ry="18" fill="#3E2723"/>
        <ellipse cx="60" cy="35" rx="35" ry="12" fill="#261412"/>
      </svg>`;

    const MOLE_NORMAL_SVG = `
      <svg viewBox="0 0 100 150" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <image href="./img_02.png" x="-20" y="-20" width="140" height="140" preserveAspectRatio="xMidYMid meet"/>
        <circle cx="50" cy="70" r="14" fill="white" opacity="0.9"/>
        <text x="50" y="76" font-family="sans-serif" font-size="20" font-weight="bold"
              fill="#CC2200" text-anchor="middle">ㄅ</text>
      </svg>`;

    const MOLE_HAPPY_SVG = `
      <svg viewBox="0 0 100 150" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <image href="./img_01.png" x="-20" y="-20" width="140" height="140" preserveAspectRatio="xMidYMid meet"/>
        <circle cx="50" cy="70" r="14" fill="white" opacity="0.9"/>
        <text x="50" y="76" font-family="sans-serif" font-size="20" font-weight="bold"
              fill="#3A8A18" text-anchor="middle">ㄅ</text>
      </svg>`;

    // ── Zhuyin pools ───────────────────────────────────────────────────────────
    const ZHUYIN_POOLS = [
      ['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ'],           // 8
      ['ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ'],                     // +6 = 14
      ['ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ'],                // +7 = 21
      ['ㄧ','ㄨ','ㄩ','ㄚ','ㄛ','ㄜ','ㄝ'],                // +7 = 28
      ['ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ'],       // +9 = 37
    ];

    // TTS pronunciation map: zhuyin → representative Chinese char with same sound
    const ZHUYIN_SPEAK = {
      'ㄅ':'玻','ㄆ':'坡','ㄇ':'摸','ㄈ':'佛',
      'ㄉ':'得','ㄊ':'特','ㄋ':'呢','ㄌ':'勒',
      'ㄍ':'哥','ㄎ':'科','ㄏ':'喝',
      'ㄐ':'基','ㄑ':'期','ㄒ':'希',
      'ㄓ':'知','ㄔ':'吃','ㄕ':'詩','ㄖ':'日',
      'ㄗ':'資','ㄘ':'次','ㄙ':'思',
      'ㄧ':'衣','ㄨ':'屋','ㄩ':'魚',
      'ㄚ':'啊','ㄛ':'哦','ㄜ':'鵝','ㄝ':'耶',
      'ㄞ':'哀','ㄟ':'欸','ㄠ':'熬','ㄡ':'歐',
      'ㄢ':'安','ㄣ':'恩','ㄤ':'昂','ㄥ':'鞥','ㄦ':'而',
    };

    // Mode 1: unlock by correct count
    const SURVIVAL_POOL_UNLOCKS = [0, 5, 10, 15, 20];
    // Mode 2: unlock by elapsed seconds
    const TIMED_POOL_UNLOCKS    = [0, 15, 30, 45, 55];

    // ── Speed level (Mode 1) ───────────────────────────────────────────────────
    // level = min(6, floor(correctCount / 5))
    // moleMs = max(700, 2000 - level * 200)
    // pts    = 10 + level * 5
    const MAX_LV = 6;
    function getSpeedLevel(n)   { return Math.min(MAX_LV, Math.floor(n / 5)); }
    function getMoleMs(lv)      { return Math.max(700, 2000 - lv * 200); }
    function getPts(lv)         { return 10 + lv * 5; }

    // ── Constants ──────────────────────────────────────────────────────────────
    const GAME_DURATION    = 60;
    const POST_SPEAK_DELAY = 650;

    // ── State ──────────────────────────────────────────────────────────────────
    let gameMode     = 'survival'; // 'survival' | 'timed'
    let score        = 0;
    let lives        = 3;
    let correctCount = 0;
    let speedLevel   = 0;
    let timeLeft     = GAME_DURATION;
    let elapsedTime  = 0;
    let targetChar   = '';
    let activePool   = [...ZHUYIN_POOLS[0]];
    let poolLevel    = 0;
    let holes        = [];
    let moleTimers   = [];
    let countdownTimer = null;
    let gameRunning  = false;
    let roundActive  = false;

    // ── DOM ─────────────────────────────────────────────────────────────────────
    const grid            = document.getElementById('grid');
    const timerDisplay    = document.getElementById('timerDisplay');
    const scoreDisplay    = document.getElementById('scoreDisplay');
    const livesDisplay    = document.getElementById('livesDisplay');
    const targetEl        = document.getElementById('targetChar');
    const timerBar        = document.getElementById('timerBar');
    const timerBarWrap    = document.getElementById('timerBarWrap');
    const timerBox        = document.getElementById('timerBox');
    const livesBox        = document.getElementById('livesBox');
    const startOverlay    = document.getElementById('startOverlay');
    const endOverlay      = document.getElementById('endOverlay');
    const endTitle        = document.getElementById('endTitle');
    const finalScore      = document.getElementById('finalScore');
    const finalCorrect    = document.getElementById('finalCorrect');
    const endMessage      = document.getElementById('endMessage');
    const endStars        = document.getElementById('endStars');
    const endCorrectRow   = document.getElementById('endCorrectRow');
    const difficultyBadge = document.getElementById('difficultyBadge');
    const quitOverlay     = document.getElementById('quitOverlay');

    // ── Build 9 holes ──────────────────────────────────────────────────────────
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'hole-cell';
      cell.dataset.index = i;
      cell.setAttribute('data-testid', `mole-hole-${i + 1}`);

      const moleDiv = document.createElement('div');
      moleDiv.className = 'mole-graphic';
      moleDiv.setAttribute('data-testid', 'mole-character');
      moleDiv.innerHTML = MOLE_NORMAL_SVG;

      const holeDiv = document.createElement('div');
      holeDiv.className = 'hole-graphic';
      holeDiv.innerHTML = HOLE_SVG;

      cell.appendChild(moleDiv);
      cell.appendChild(holeDiv);
      grid.appendChild(cell);

      holes.push({ cell, moleDiv, up: false, char: '', isTarget: false });
      moleTimers.push(null);
    }

    // ── Audio ──────────────────────────────────────────────────────────────────
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
      }
      return audioCtx;
    }

    function playTone(freq, dur, type = 'sine', vol = 0.28) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    }

    function playSuccessSound() {
      playTone(523, 0.12);
      setTimeout(() => playTone(659, 0.12), 110);
      setTimeout(() => playTone(784, 0.22), 220);
    }

    function playErrorSound() {
      playTone(300, 0.09, 'sawtooth', 0.15);
      setTimeout(() => playTone(220, 0.14, 'sawtooth', 0.10), 90);
    }

    function playLevelUpSound() {
      playTone(659, 0.10);
      setTimeout(() => playTone(784, 0.10), 110);
      setTimeout(() => playTone(1047, 0.22), 220);
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      // Use representative Chinese character for cleaner zhuyin pronunciation
      const mapped = ZHUYIN_SPEAK[text] ?? text;
      const utter = new SpeechSynthesisUtterance(mapped);
      utter.lang = 'zh-TW';
      utter.rate = 0.75;
      utter.pitch = 1.35;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    // ── Utilities ──────────────────────────────────────────────────────────────
    function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function shuffled(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showFloating(x, y, text, color) {
      const el = document.createElement('div');
      el.className = 'float-score';
      el.textContent = text;
      el.style.color = color;
      el.style.left = `${x}px`;
      el.style.top  = `${y}px`;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function setMoleSvg(holeObj, svgString, char) {
      holeObj.moleDiv.innerHTML = svgString;
      holeObj.moleDiv.querySelector('text').textContent = char;
    }

    function livesEmoji(n) {
      return '❤️'.repeat(n) + '🖤'.repeat(3 - n);
    }

    // ── Pool unlock ────────────────────────────────────────────────────────────
    function updatePool() {
      const unlocks = gameMode === 'survival' ? SURVIVAL_POOL_UNLOCKS : TIMED_POOL_UNLOCKS;
      const value   = gameMode === 'survival' ? correctCount : elapsedTime;
      let changed = false;
      for (let lvl = poolLevel + 1; lvl < unlocks.length; lvl++) {
        if (value >= unlocks[lvl]) {
          activePool = [...activePool, ...ZHUYIN_POOLS[lvl]];
          poolLevel = lvl;
          changed = true;
        }
      }
      if (changed) updateBadge();
    }

    function updateBadge() {
      if (gameMode === 'survival') {
        difficultyBadge.textContent =
          `速度 Lv.${speedLevel + 1}　每題 +${getPts(speedLevel)} 分`;
      } else {
        difficultyBadge.textContent = `練習中：${activePool.length} 個注音`;
      }
    }

    // ── Mole management ────────────────────────────────────────────────────────
    function loseLife(cellEl) {
      lives--;
      livesDisplay.textContent = livesEmoji(lives);
      if (cellEl) {
        const r = cellEl.getBoundingClientRect();
        showFloating(r.left + r.width / 2 - 22, r.top + r.height / 3, '-❤️', '#E53935');
      }
      playErrorSound();
      if (lives <= 0) {
        gameRunning = false; // block new rounds immediately
        setTimeout(() => endGame(), 350);
      }
    }

    // silent=true skips the life-loss penalty (used when resetting/ending)
    function hideMole(idx, silent = false) {
      const h = holes[idx];
      if (!h.up) return;
      clearTimeout(moleTimers[idx]);
      const wasTarget = h.isTarget;
      h.cell.classList.remove('up');
      h.up = false; h.char = ''; h.isTarget = false;
      setTimeout(() => setMoleSvg(h, MOLE_NORMAL_SVG, ''), 280);
      if (!silent && wasTarget && gameMode === 'survival' && gameRunning) {
        loseLife(h.cell);
      }
    }

    function hideAllMoles() {
      holes.forEach((_, i) => {
        clearTimeout(moleTimers[i]);
        const h = holes[i];
        h.cell.classList.remove('up', 'hit', 'wrong');
        h.up = false; h.char = ''; h.isTarget = false;
        setMoleSvg(h, MOLE_NORMAL_SVG, '');
      });
    }

    // ── Round logic ────────────────────────────────────────────────────────────
    function startRound() {
      if (!gameRunning || roundActive) return;
      roundActive = true;
      targetChar = randItem(activePool);
      targetEl.textContent = targetChar;
      speak(targetChar);
      setTimeout(() => { if (gameRunning) spawnMoles(); }, POST_SPEAK_DELAY);
    }

    function spawnMoles() {
      const visibleMs   = gameMode === 'survival' ? getMoleMs(speedLevel) : 2000;
      const count       = Math.floor(Math.random() * 3) + 2; // 2–4, always ≥1 distractor
      const indices     = shuffled([0,1,2,3,4,5,6,7,8]).slice(0, count);
      const targetIndex = randItem(indices);
      const distractors = activePool.filter(z => z !== targetChar);

      indices.forEach(idx => {
        const h      = holes[idx];
        const isTgt  = (idx === targetIndex);
        const char   = isTgt ? targetChar : randItem(distractors);
        h.char = char; h.isTarget = isTgt; h.up = true;
        setMoleSvg(h, MOLE_NORMAL_SVG, char);
        h.cell.classList.add('up');
        moleTimers[idx] = setTimeout(() => {
          if (h.up) { hideMole(idx); checkRoundComplete(); }
        }, visibleMs);
      });
    }

    function checkRoundComplete() {
      if (!holes.some(h => h.up) && gameRunning) {
        roundActive = false;
        setTimeout(startRound, 350);
      }
    }

    // ── Click handler ──────────────────────────────────────────────────────────
    function handleMoleClick(e) {
      if (!gameRunning) return;
      const cell = e.target.closest('.hole-cell');
      if (!cell) return;
      const idx = parseInt(cell.dataset.index);
      const h   = holes[idx];
      if (!h.up) return;

      const rect = cell.getBoundingClientRect();
      const cx   = rect.left + rect.width  / 2;
      const cy   = rect.top  + rect.height / 3;

      if (h.isTarget) {
        // ── Correct ─────────────────────────────────────────────────────────
        correctCount++;
        const prevLevel = speedLevel;
        speedLevel = getSpeedLevel(correctCount);
        const pts = getPts(prevLevel); // score at the level BEFORE this hit
        score += pts;
        scoreDisplay.textContent = score;

        updatePool();
        updateBadge();

        if (gameMode === 'survival' && speedLevel > prevLevel) {
          playLevelUpSound();
          showFloating(cx - 50, cy - 30, `速度 Lv.${speedLevel + 1}！`, '#1E88E5');
        }

        clearTimeout(moleTimers[idx]);
        h.up = false;
        setMoleSvg(h, MOLE_HAPPY_SVG, h.char);
        h.cell.classList.remove('up');
        h.cell.classList.add('hit');
        showFloating(cx - 22, cy, `+${pts} ✨`, '#F9A825');
        playSuccessSound();

        setTimeout(() => {
          h.cell.classList.remove('hit');
          h.char = ''; h.isTarget = false;
          setMoleSvg(h, MOLE_NORMAL_SVG, '');
          hideAllMoles();
          roundActive = false;
          if (gameRunning) startRound();
        }, 480);

      } else {
        // ── Wrong ────────────────────────────────────────────────────────────
        clearTimeout(moleTimers[idx]);
        h.up = false; h.isTarget = false;
        h.cell.classList.add('wrong');

        if (gameMode === 'survival') {
          loseLife(h.cell);
          if (lives <= 0) return; // endGame already scheduled
        }

        setTimeout(() => {
          h.cell.classList.remove('wrong', 'up');
          h.char = '';
          setMoleSvg(h, MOLE_NORMAL_SVG, '');
          checkRoundComplete();
        }, 250);
      }
    }

    grid.addEventListener('click', handleMoleClick);
    grid.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t  = e.changedTouches[0];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      if (el) el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }, { passive: false });

    // ── Game lifecycle ─────────────────────────────────────────────────────────
    function startGame() {
      score        = 0;
      lives        = 3;
      correctCount = 0;
      speedLevel   = 0;
      timeLeft     = GAME_DURATION;
      elapsedTime  = 0;
      poolLevel    = 0;
      activePool   = [...ZHUYIN_POOLS[0]];
      gameRunning  = true;
      roundActive  = false;

      scoreDisplay.textContent = '0';
      hideAllMoles();
      startOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');

      if (gameMode === 'survival') {
        timerBox.classList.add('hidden');
        timerBarWrap.classList.add('hidden');
        livesBox.classList.remove('hidden');
        livesDisplay.textContent = livesEmoji(3);
        updateBadge();
      } else {
        timerBox.classList.remove('hidden');
        timerBarWrap.classList.remove('hidden');
        livesBox.classList.add('hidden');
        timerDisplay.textContent = GAME_DURATION;
        timerBar.style.width = '100%';
        updateBadge();

        countdownTimer = setInterval(() => {
          timeLeft--;
          elapsedTime++;
          timerDisplay.textContent = timeLeft;
          timerBar.style.width = `${(timeLeft / GAME_DURATION) * 100}%`;
          updatePool();
          if (timeLeft <= 0) endGame();
        }, 1000);
      }

      setTimeout(startRound, 400);
    }

    function endGame() {
      gameRunning = false;
      roundActive = false;
      clearInterval(countdownTimer);
      moleTimers.forEach(clearTimeout);
      hideAllMoles();

      let stars, msg;

      if (gameMode === 'survival') {
        endTitle.textContent = '遊戲結束！';
        endCorrectRow.classList.add('hidden');
        if (score >= 150) {
          stars = '⭐⭐⭐'; msg = '太厲害了！注音小達人！🎉';
        } else if (score >= 70) {
          stars = '⭐⭐';   msg = '做得很棒！繼續加油！😊';
        } else {
          stars = '⭐';     msg = '不錯喔！再練習一下！💪';
        }
        speak(`遊戲結束！你得了 ${score} 分！`);
      } else {
        endTitle.textContent = '時間到！';
        endCorrectRow.classList.remove('hidden');
        finalCorrect.textContent = correctCount;
        if (score >= 100) {
          stars = '⭐⭐⭐'; msg = '太厲害了！注音小達人！🎉';
        } else if (score >= 50) {
          stars = '⭐⭐';   msg = '做得很棒！繼續加油！😊';
        } else {
          stars = '⭐';     msg = '不錯喔！再練習一下！💪';
        }
        speak(`時間到！你答對了 ${correctCount} 題，得了 ${score} 分！`);
      }

      endStars.textContent   = stars;
      finalScore.textContent = score;
      endMessage.textContent = msg;
      endOverlay.classList.remove('hidden');

      playTone(523, 0.14);
      setTimeout(() => playTone(659, 0.14), 170);
      setTimeout(() => playTone(784, 0.28), 340);
    }

    // ── Pause / quit ───────────────────────────────────────────────────────────
    function pauseGame() {
      if (!gameRunning) return;
      gameRunning = false;
      roundActive = false;
      clearInterval(countdownTimer);
      moleTimers.forEach(clearTimeout);
      hideAllMoles();
      quitOverlay.classList.remove('hidden');
    }

    function resumeGame() {
      quitOverlay.classList.add('hidden');
      gameRunning = true;
      if (gameMode === 'timed') {
        countdownTimer = setInterval(() => {
          timeLeft--;
          elapsedTime++;
          timerDisplay.textContent = timeLeft;
          timerBar.style.width = `${(timeLeft / GAME_DURATION) * 100}%`;
          updatePool();
          if (timeLeft <= 0) endGame();
        }, 1000);
      }
      setTimeout(startRound, 300);
    }

    function quitToMenu() {
      gameRunning = false;
      clearInterval(countdownTimer);
      moleTimers.forEach(clearTimeout);
      hideAllMoles();
      quitOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');
      startOverlay.classList.remove('hidden');
    }

    document.getElementById('quitBtn').addEventListener('click', pauseGame);
    document.getElementById('resumeBtn').addEventListener('click', resumeGame);
    document.getElementById('quitConfirmBtn').addEventListener('click', quitToMenu);

    // ── Buttons ────────────────────────────────────────────────────────────────
    document.getElementById('mode1Btn').addEventListener('click', () => {
      getAudioCtx();
      gameMode = 'survival';
      startGame();
    });

    document.getElementById('mode2Btn').addEventListener('click', () => {
      getAudioCtx();
      gameMode = 'timed';
      startGame();
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      getAudioCtx();
      startGame(); // same mode
    });

    document.getElementById('changeModeBtn').addEventListener('click', () => {
      endOverlay.classList.add('hidden');
      startOverlay.classList.remove('hidden');
    });
  </script>
</body>
</html>
